
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Booking Project</title>
</head>
<body>

    <h1>After School Lessons</h1>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">
        <h2>{{ subject }}</h2>
        <p>Location: {{ location }}</p>
        <p>Price: £{{ price }}</p>
    </div>

    <script>
        const { createApp } = Vue;

        const app = createApp({
            data() {
                return {
                    subject: "Maths",
                    location: "Hendon",
                    price: 20
                };
            }
        });

        app.mount("#app");
    </script>

</body>
</html>
